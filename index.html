<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bien-être</title><meta name="theme-color" content="#f6f3ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Bien-être"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#292b2d;background:#f6f3ee}body{margin:0}.app{max-width:1100px;margin:auto;padding:22px}.top,.nav,.tabs,.days,.chips,.goalhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.pill,button{border:1px solid #d8d0c5;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;color:inherit}.active{background:#e7dfd2}.card{background:#fff;border:1px solid #ded8cf;border-radius:18px;padding:16px;margin-top:14px}.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:#777}.cell{min-height:72px;border:1px solid #e3ddd4;border-radius:12px;padding:7px;background:#fff;cursor:pointer}.cell small{display:block;color:#777;margin-top:6px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border-radius:12px;text-align:center}.schedule{display:grid;gap:7px}.row{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:9px;border:1px solid #e5dfd6;border-radius:11px}.muted{color:#777}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}.choice.on{background:#e7dfd2}.goals{display:grid;gap:8px}.goal{border:1px solid #e3ddd4;border-radius:12px;overflow:hidden}.goalhead{justify-content:space-between;padding:10px 12px;cursor:pointer}.detail{padding:0 12px 10px;color:#666;font-size:13px}.hidden{display:none!important}h1,h2,h3{margin:0}.range{text-align:center;font-weight:650}.note{font-size:12px;color:#777}@media(max-width:700px){.days{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:90px 1fr}.monthgrid{font-size:13px}.cell{min-height:58px;padding:5px}}
</style></head><body><main class="app"><div class="top"><div><div class="muted">Mon calendrier bien-être</div><h2 id="title"></h2></div><div class="tabs"><button id="monthBtn" class="active">Mois</button><button id="weekBtn">Semaine</button></div></div>
<section id="month"><div class="nav card" style="justify-content:space-between"><button id="pm">‹</button><b id="mn"></b><button id="nm">›</button></div><div class="card"><div class="monthgrid" id="heads"></div><div class="monthgrid" id="mg"></div></div></section>
<section id="week" class="hidden"><div class="nav card" style="justify-content:space-between"><button id="pw">‹</button><div class="range" id="wr"></div><button id="nw">›</button></div><div id="days" class="days card"></div><div class="card"><h2 id="dt"></h2><div id="sched" class="schedule" style="margin-top:12px"></div><hr style="border:0;border-top:1px solid #e4ddd3;margin:18px 0"><h3>Ce que j’ai réellement fait</h3><p class="muted">Tu peux cocher plusieurs choses. « Rien 🌿 » correspond seulement au bloc libre du soir.</p><div id="choices" class="choices"></div></div><div class="card"><h3>Cumul de la semaine · par but</h3><div id="goals" class="goals" style="margin-top:10px"></div></div></section>
<p class="note">Les coches sont sauvegardées dans ce navigateur sur cet appareil.</p></main><script>
const D=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const choices=['Marche','Yoga','PulseTo','Tapis rouge / NIR','Méditation','Mindvalley','Thaïs Gibson','Silva','Danse intuitive','Mobilité douce','Étirements','Muscu / Pilates','Zumba','Ringuette','Brossage à sec','Pompages lymphatiques','Trampoline','IPL menton + aisselles','IPL cuisses','RF visage','RF décolleté','RF cuisse D','RF cuisse G','Gua sha','Revue ostéo','Rien 🌿'];
const groups={
'✨ Entretien peau / collagène / poils':['RF visage','RF décolleté','RF cuisse D','RF cuisse G','IPL menton + aisselles','IPL cuisses','Gua sha'],
'🔴 Mitochondries / NIR':['Tapis rouge / NIR'],
'💧 Lymphe':['Brossage à sec','Pompages lymphatiques','Trampoline'],
'💪 Musculation':['Muscu / Pilates'],
'🧘 Mobilité':['Yoga','Mobilité douce','Étirements'],
'🧠 Manifestation / esprit':['Méditation','Mindvalley','Thaïs Gibson','Silva'],
'🏃 Sport / cardio':['Marche','Zumba','Ringuette','Danse intuitive'],
'⚡ Régulation / énergie':['Donna Eden','Respiration / reset','PulseTo'],
'📚 Ostéo / développement':['Revue ostéo'],
'🌿 Repos / espace libre':['Rien 🌿']};
const base={
'Lundi':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['9 h–17 h','Travail'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Avant 15 h','Marche'],['14 h 30','Respiration / reset'],['Soir','Yoga ou PulseTo · NIR possible'],['21 h 30','Mindvalley / petite marche / danse intuitive / mobilité / rien 🌿']],
'Mardi':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['9 h–16 h 30','Travail'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Avant 15 h','Marche'],['14 h 30','Respiration / reset'],['16 h 30','Muscu / Pilates'],['Soir','NIR / récupération'],['21 h 30','Bloc libre']],
'Mercredi':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['9 h–17 h','Travail'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Avant 15 h','Marche'],['14 h 30','Respiration / reset'],['Soir','Yoga / PulseTo / NIR · soin si prévu'],['21 h 30','Bloc libre']],
'Jeudi':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['9 h–16 h 30','Travail'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Avant 15 h','Marche'],['14 h 30','Respiration / reset'],['16 h 30','Muscu / Pilates'],['Soir','NIR / récupération · RF cuisse G si D la veille'],['21 h 30','Bloc libre']],
'Vendredi':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['Matin','Revue ostéo · 30 min'],['Journée','Travail'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Avant 15 h','Marche'],['Fin PM','3e entraînement possible'],['Soir','Yoga / PulseTo / NIR'],['21 h 30','Bloc libre']],
'Samedi':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Journée','Zumba'],['Soin si prévu','IPL menton+aisselles · 15 min OU cuisses · 30 min'],['Récupération','Yoga / PulseTo / NIR'],['21 h 30','Bloc libre']],
'Dimanche':[['7 h 30','Laver visage · 3 min'],['7 h 33','Donna Eden · 3 min'],['7 h 36','Lumière extérieure + café · 10 min'],['11 h 50','Lymphatique · 5–10 min : brossage à sec OU pompages OU trampoline'],['Matin / journée','Thaïs Gibson + méditation'],['Soin si prévu','RF visage · 20 min + décolleté · 20 min'],['Récupération','Yoga / PulseTo / NIR'],['Fin journée','Préparation douce de la semaine'],['21 h 30','Bloc libre']]};
let state=JSON.parse(localStorage.getItem('bienetre-state')||'{}'), year=2026,month=9,ws=new Date(2026,8,28),sel=0; const $=s=>document.querySelector(s); const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; const setFor=d=>new Set(state[key(d)]||[]); const save=(d,s)=>{state[key(d)]=[...s];localStorage.setItem('bienetre-state',JSON.stringify(state))}; const fmt=(d,o)=>new Intl.DateTimeFormat('fr-CA',o).format(d);
function mode(m){$('#month').classList.toggle('hidden',m!=='m');$('#week').classList.toggle('hidden',m!=='w');$('#monthBtn').classList.toggle('active',m==='m');$('#weekBtn').classList.toggle('active',m==='w');m==='m'?renderMonth():renderWeek()}
function renderMonth(){let b=new Date(year,month,1);$('#mn').textContent=fmt(b,{month:'long',year:'numeric'});$('#title').textContent=fmt(b,{month:'long',year:'numeric'});$('#heads').innerHTML=D.map(x=>`<div class="dow">${x.slice(0,3)}</div>`).join('');let g=$('#mg');g.innerHTML='';let off=(b.getDay()+6)%7;for(let i=0;i<off;i++)g.append(document.createElement('div'));for(let n=1;n<=new Date(year,month+1,0).getDate();n++){let d=new Date(year,month,n),s=setFor(d),e=document.createElement('div');e.className='cell';e.innerHTML=`<b>${n}</b>${s.size?`<small>${s.size} activité${s.size>1?'s':''}</small>`:''}`;e.onclick=()=>{let di=(d.getDay()+6)%7;ws=new Date(d);ws.setDate(d.getDate()-di);sel=di;mode('w')};g.append(e)}}
function renderWeek(){let en=new Date(ws);en.setDate(en.getDate()+6);$('#wr').textContent=`Du ${fmt(ws,{day:'numeric',month:'long'})} au ${fmt(en,{day:'numeric',month:'long',year:'numeric'})}`;$('#title').textContent='Semaine '+$('#wr').textContent.toLowerCase();let box=$('#days');box.innerHTML='';D.forEach((name,i)=>{let d=new Date(ws);d.setDate(d.getDate()+i);let b=document.createElement('button');b.className='day '+(i===sel?'active':'');b.innerHTML=`<b>${name.slice(0,3)} ${d.getDate()}</b><br><small>${setFor(d).size||'—'}</small>`;b.onclick=()=>{sel=i;renderWeek()};box.append(b)});let d=new Date(ws);d.setDate(d.getDate()+sel);let name=D[sel];$('#dt').textContent=`${name} ${d.getDate()} ${fmt(d,{month:'long'})}`;$('#sched').innerHTML=base[name].map(x=>`<div class="row"><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join('');let s=setFor(d),c=$('#choices');c.innerHTML='';choices.forEach(a=>{let b=document.createElement('button');b.className='choice '+(s.has(a)?'on':'');b.textContent=(s.has(a)?'✓ ':'')+a;b.onclick=()=>{s.has(a)?s.delete(a):s.add(a);save(d,s);renderWeek()};c.append(b)});renderGoals()}
function renderGoals(){let out=$('#goals');out.innerHTML='';for(const [g,items] of Object.entries(groups)){let counts={},days=0,total=0;for(let i=0;i<7;i++){let d=new Date(ws);d.setDate(d.getDate()+i);let s=setFor(d),hit=false;items.forEach(a=>{if(s.has(a)){counts[a]=(counts[a]||0)+1;total++;hit=true}});if(hit)days++}let e=document.createElement('div');e.className='goal';let summary=(g.includes('Lymphe')||g.includes('Manifestation')||g.includes('Repos'))?`${days}/7 jours`:`${total}×`;let detail=items.map(a=>`${a} ${counts[a]||0}×`).join(' · ');e.innerHTML=`<div class="goalhead"><b>${g}</b><b>${summary}</b></div><div class="detail hidden">${detail}</div>`;e.querySelector('.goalhead').onclick=()=>e.querySelector('.detail').classList.toggle('hidden');out.append(e)}}
$('#monthBtn').onclick=()=>mode('m');$('#weekBtn').onclick=()=>mode('w');$('#pm').onclick=()=>{month--;if(month<0){month=11;year--}renderMonth()};$('#nm').onclick=()=>{month++;if(month>11){month=0;year++}renderMonth()};$('#pw').onclick=()=>{ws.setDate(ws.getDate()-7);renderWeek()};$('#nw').onclick=()=>{ws.setDate(ws.getDate()+7);renderWeek()};mode('m');
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}</script></body></html>
